{% extends "base.html" %}

{% block title %}Admin Portal Login - Bullz Command Center{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
  <div class="green-auth-card" style="border-color: rgba(25,211,138,.4); box-shadow: 0 0 50px rgba(25,211,138,.2);">
    <div style="text-align:center; font-size:42px; margin-bottom:8px;">🛡️</div>
    <h2 class="auth-title" style="color:var(--mint); margin-bottom:6px;">Admin Portal</h2>
    <p style="text-align:center; color:var(--mute); font-size:13px; margin-bottom:20px;">
      Restricted zone for client management, rate updates &amp; ledger cascading.
    </p>

    <div class="auth-role-tabs">
      <a class="auth-role-tab" href="/login">👤 User Login</a>
      <button class="auth-role-tab active" type="button">🛡️ Admin Portal</button>
    </div>

    <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
      <div class="auth-input-group">
        <label class="auth-label">Administrator Email</label>
        <input type="email" id="adminLoginEmail" class="auth-input" value="admin@gmail.com" required autofocus>
      </div>

      <div class="auth-input-group">
        <label class="auth-label">Security Password</label>
        <div class="pw-wrap">
          <input type="password" id="adminLoginPassword" class="auth-input" value="admin" required>
          <button type="button" class="pw-eye" onclick="const p = document.getElementById('adminLoginPassword'); p.type = p.type === 'password' ? 'text' : 'password';">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn-auth-submit" style="background: linear-gradient(135deg, #27e39a, #0fae70);">
        Unlock Admin Console
      </button>

      <div class="quick-demo-accounts" style="margin-top:24px;">
        <div class="quick-demo-title">Default Credentials:</div>
        <code style="display:block; padding:8px; background:rgba(0,0,0,.5); border-radius:8px; font-size:12px; color:var(--mint);">
          admin@gmail.com / admin
        </code>
      </div>
    </form>
  </div>
</div>
{% endblock %}
