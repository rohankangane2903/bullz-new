<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" width="100%" height="100%">
  <defs>
    <filter id="cardDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="curveFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <g transform="translate(20, 20)">
    <!-- Main Card Container -->
    <rect x="0" y="0" width="380" height="340" rx="20" fill="#ffffff" filter="url(#cardDrop)" stroke="#f1f5f9" stroke-width="2"/>

    <!-- Plan Row 1: 1 Month Plan -->
    <g transform="translate(24, 24)">
      <rect x="0" y="0" width="332" height="68" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="14" y="14" width="40" height="40" rx="10" fill="#d1fae5"/>
      <text x="34" y="39" text-anchor="middle" font-size="20">📈</text>
      <text x="68" y="32" font-family="system-ui, sans-serif" font-weight="700" font-size="15" fill="#1e293b">1 Month plan</text>
      <text x="68" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Bullzz Fast Returns</text>
      <text x="314" y="40" text-anchor="end" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#10b981">+10.00%</text>
    </g>

    <!-- Plan Row 2: 5 Month Plan -->
    <g transform="translate(24, 106)">
      <rect x="0" y="0" width="332" height="68" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="14" y="14" width="40" height="40" rx="10" fill="#d1fae5"/>
      <text x="34" y="39" text-anchor="middle" font-size="20">💎</text>
      <text x="68" y="32" font-family="system-ui, sans-serif" font-weight="700" font-size="15" fill="#1e293b">5 Month plan</text>
      <text x="68" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Compound Monthly Growth</text>
      <text x="314" y="40" text-anchor="end" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#10b981">+10.00%</text>
    </g>

    <!-- Plan Row 3: Basic Plan with Growth Chart -->
    <g transform="translate(24, 188)">
      <rect x="0" y="0" width="332" height="126" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
      <text x="18" y="32" font-family="system-ui, sans-serif" font-weight="700" font-size="15" fill="#166534">Basic Plan</text>
      <text x="314" y="32" text-anchor="end" font-family="system-ui, sans-serif" font-weight="800" font-size="16" fill="#15803d">10.00%</text>
      <text x="18" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#15803d">Annual Yield Benchmark</text>

      <!-- Mini Chart -->
      <path d="M 18 105 Q 80 100 140 85 T 250 68 T 314 55 L 314 116 L 18 116 Z" fill="url(#curveFill)"/>
      <path d="M 18 105 Q 80 100 140 85 T 250 68 T 314 55" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
      <circle cx="314" cy="55" r="4.5" fill="#10b981"/>
    </g>
  </g>
</svg>
