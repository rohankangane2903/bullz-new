<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="goldCoinSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Dark container matching video's about image banner -->
  <rect width="900" height="360" rx="16" fill="url(#bgGrad)"/>

  <!-- Left: Trading Laptop Screen -->
  <g transform="translate(60, 40)" filter="url(#shadow)">
    <!-- Laptop screen border -->
    <rect x="0" y="0" width="460" height="260" rx="12" fill="#111827" stroke="#334155" stroke-width="3"/>
    <rect x="14" y="14" width="432" height="232" rx="4" fill="#090d16"/>
    
    <!-- Screen Header -->
    <rect x="14" y="14" width="432" height="26" fill="#1e293b"/>
    <circle cx="28" cy="27" r="4" fill="#ef4444"/>
    <circle cx="42" cy="27" r="4" fill="#f59e0b"/>
    <circle cx="56" cy="27" r="4" fill="#10b981"/>
    <text x="75" y="31" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">BULLZZ PRO TRADER — BTC/USD 1D</text>
    <text x="380" y="31" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold">+14.82%</text>

    <!-- Candlestick chart grid -->
    <line x1="14" y1="90" x2="446" y2="90" stroke="#1e293b" stroke-dasharray="3,3"/>
    <line x1="14" y1="140" x2="446" y2="140" stroke="#1e293b" stroke-dasharray="3,3"/>
    <line x1="14" y1="190" x2="446" y2="190" stroke="#1e293b" stroke-dasharray="3,3"/>

    <!-- Candlesticks -->
    <!-- Bar 1 -->
    <line x1="40" y1="120" x2="40" y2="190" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="36" y="135" width="8" height="40" fill="#ef4444" rx="1"/>
    <!-- Bar 2 -->
    <line x1="65" y1="110" x2="65" y2="180" stroke="#10b981" stroke-width="1.5"/>
    <rect x="61" y="125" width="8" height="35" fill="#10b981" rx="1"/>
    <!-- Bar 3 -->
    <line x1="90" y1="95" x2="90" y2="160" stroke="#10b981" stroke-width="1.5"/>
    <rect x="86" y="105" width="8" height="40" fill="#10b981" rx="1"/>
    <!-- Bar 4 -->
    <line x1="115" y1="120" x2="115" y2="170" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="111" y="130" width="8" height="25" fill="#ef4444" rx="1"/>
    <!-- Bar 5 -->
    <line x1="140" y1="100" x2="140" y2="155" stroke="#10b981" stroke-width="1.5"/>
    <rect x="136" y="110" width="8" height="30" fill="#10b981" rx="1"/>
    <!-- Bar 6 -->
    <line x1="165" y1="80" x2="165" y2="145" stroke="#10b981" stroke-width="1.5"/>
    <rect x="161" y="90" width="8" height="40" fill="#10b981" rx="1"/>
    <!-- Bar 7 -->
    <line x1="190" y1="70" x2="190" y2="130" stroke="#10b981" stroke-width="1.5"/>
    <rect x="186" y="75" width="8" height="35" fill="#10b981" rx="1"/>
    <!-- Bar 8 -->
    <line x1="215" y1="90" x2="215" y2="140" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="211" y="95" width="8" height="30" fill="#ef4444" rx="1"/>
    <!-- Bar 9 -->
    <line x1="240" y1="65" x2="240" y2="120" stroke="#10b981" stroke-width="1.5"/>
    <rect x="236" y="70" width="8" height="35" fill="#10b981" rx="1"/>
    <!-- Bar 10 -->
    <line x1="265" y1="55" x2="265" y2="110" stroke="#10b981" stroke-width="1.5"/>
    <rect x="261" y="60" width="8" height="40" fill="#10b981" rx="1"/>
    <!-- Bar 11 -->
    <line x1="290" y1="60" x2="290" y2="125" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="286" y="75" width="8" height="30" fill="#ef4444" rx="1"/>
    <!-- Bar 12 -->
    <line x1="315" y1="45" x2="315" y2="105" stroke="#10b981" stroke-width="1.5"/>
    <rect x="311" y="50" width="8" height="40" fill="#10b981" rx="1"/>
    <!-- Bar 13 -->
    <line x1="340" y1="40" x2="340" y2="90" stroke="#10b981" stroke-width="1.5"/>
    <rect x="336" y="45" width="8" height="35" fill="#10b981" rx="1"/>
    <!-- Bar 14 -->
    <line x1="365" y1="35" x2="365" y2="85" stroke="#10b981" stroke-width="1.5"/>
    <rect x="361" y="40" width="8" height="30" fill="#10b981" rx="1"/>
    <!-- Bar 15 -->
    <line x1="390" y1="30" x2="390" y2="80" stroke="#10b981" stroke-width="1.5"/>
    <rect x="386" y="35" width="8" height="35" fill="#10b981" rx="1"/>

    <!-- Glowing Trend Curve Area -->
    <path d="M 36 155 Q 110 130 180 90 T 320 60 T 430 45 L 430 240 L 36 240 Z" fill="url(#chartGrad)"/>
    <path d="M 36 155 Q 110 130 180 90 T 320 60 T 430 45" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>

    <!-- Pulse point on latest price -->
    <circle cx="430" cy="45" r="5" fill="#10b981"/>
    <circle cx="430" cy="45" r="9" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Right: Calculator & Currency Stack & Coins (matching frame 8s) -->
  <g transform="translate(560, 45)" filter="url(#shadow)">
    <!-- White Currency Banknotes / Paper Stack -->
    <g transform="rotate(-6, 120, 100)">
      <rect x="20" y="30" width="220" height="130" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="30" y="40" width="200" height="110" rx="4" fill="none" stroke="#94a3b8" stroke-dasharray="4,4"/>
      <circle cx="130" cy="95" r="28" fill="#e2e8f0"/>
      <text x="130" y="103" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="24" fill="#64748b">₹</text>
      <text x="40" y="55" font-family="monospace" font-size="12" fill="#64748b" font-weight="bold">₹500</text>
      <text x="205" y="142" font-family="monospace" font-size="12" fill="#64748b" font-weight="bold">₹500</text>
    </g>

    <!-- Golden Coins Stack -->
    <g transform="translate(40, 110)">
      <!-- Coin 1 -->
      <ellipse cx="60" cy="55" rx="36" ry="14" fill="url(#goldCoinSide)"/>
      <ellipse cx="60" cy="50" rx="36" ry="14" fill="url(#goldCoin)"/>
      <ellipse cx="60" cy="50" rx="28" ry="10" fill="none" stroke="#ca8a04" stroke-width="1.5"/>
      <text x="60" y="54" text-anchor="middle" font-size="14" font-weight="bold" fill="#713f12">₿</text>
      <!-- Coin 2 -->
      <ellipse cx="120" cy="75" rx="42" ry="16" fill="url(#goldCoinSide)"/>
      <ellipse cx="120" cy="68" rx="42" ry="16" fill="url(#goldCoin)"/>
      <ellipse cx="120" cy="68" rx="34" ry="12" fill="none" stroke="#ca8a04" stroke-width="1.5"/>
      <text x="120" y="73" text-anchor="middle" font-size="18" font-weight="bold" fill="#713f12">₹</text>
    </g>

    <!-- Digital Calculator (matching "68.654" from video) -->
    <g transform="translate(90, 175) rotate(4)">
      <rect x="0" y="0" width="160" height="100" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2.5"/>
      <!-- Screen with 68.654 -->
      <rect x="12" y="10" width="136" height="34" rx="4" fill="#020617"/>
      <text x="140" y="34" text-anchor="end" font-family="monospace" font-weight="bold" font-size="20" fill="#22c55e">68.654</text>
      <!-- Keypad -->
      <g fill="#1e293b" rx="2">
        <rect x="14" y="52" width="24" height="16" rx="3"/>
        <rect x="44" y="52" width="24" height="16" rx="3"/>
        <rect x="74" y="52" width="24" height="16" rx="3"/>
        <rect x="104" y="52" width="42" height="16" fill="#10b981" rx="3"/>

        <rect x="14" y="74" width="24" height="16" rx="3"/>
        <rect x="44" y="74" width="24" height="16" rx="3"/>
        <rect x="74" y="74" width="24" height="16" rx="3"/>
        <rect x="104" y="74" width="42" height="16" fill="#059669" rx="3"/>
      </g>
    </g>
  </g>
</svg>
