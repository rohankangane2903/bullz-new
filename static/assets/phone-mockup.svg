<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 540" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="phoneShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#059669" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Phone Mockup Container -->
  <g transform="translate(30, 20)" filter="url(#phoneShadow)">
    <!-- Outer phone chassis -->
    <rect x="0" y="0" width="280" height="490" rx="36" fill="url(#phoneBody)" stroke="#e2e8f0" stroke-width="4"/>
    <!-- Speaker & front camera notch -->
    <rect x="95" y="14" width="90" height="18" rx="9" fill="#0f172a"/>
    <circle cx="155" cy="23" r="3.5" fill="#334155"/>

    <!-- Screen area -->
    <g transform="translate(14, 38)">
      <rect x="0" y="0" width="252" height="434" rx="24" fill="#f8fafc"/>

      <!-- App Header -->
      <g transform="translate(16, 16)">
        <text x="0" y="16" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#0f172a">Bullz</text>
        <circle cx="210" cy="10" r="12" fill="#d1fae5"/>
        <text x="210" y="14" text-anchor="middle" font-size="11" fill="#059669" font-weight="bold">₹</text>
      </g>

      <!-- Bull mascot & growth illustration (matching video frame 0s) -->
      <g transform="translate(24, 46)">
        <!-- Mint green circle background -->
        <circle cx="102" cy="70" r="58" fill="#d1fae5" opacity="0.8"/>
        
        <!-- Stylized Bull / Investor icon -->
        <path d="M 80 60 C 70 40 100 30 110 50 C 130 30 145 45 130 70 C 140 90 120 110 102 110 C 85 110 75 90 80 60 Z" fill="#10b981"/>
        <circle cx="102" cy="55" r="14" fill="#047857"/>
        
        <!-- Graph lines floating around bull -->
        <path d="M 50 100 L 75 80 L 105 90 L 145 50" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
        <circle cx="145" cy="50" r="4" fill="#059669"/>
        
        <!-- Mini floating stat badge -->
        <g transform="translate(10, 15)">
          <rect x="0" y="0" width="60" height="24" rx="6" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>
          <text x="8" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#059669">↑ +10%</text>
        </g>
      </g>

      <!-- App Card 1: Investment Plan -->
      <g transform="translate(16, 195)">
        <rect x="0" y="0" width="220" height="64" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
        <rect x="12" y="14" width="36" height="36" rx="10" fill="#ecfdf5"/>
        <text x="30" y="37" text-anchor="middle" font-size="18">📈</text>
        <text x="60" y="28" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#1e293b">1 Month Plan</text>
        <text x="60" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Guaranteed Return</text>
        <text x="205" y="36" text-anchor="end" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#10b981">+10.00%</text>
      </g>

      <!-- App Card 2: Investment Plan -->
      <g transform="translate(16, 268)">
        <rect x="0" y="0" width="220" height="64" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
        <rect x="12" y="14" width="36" height="36" rx="10" fill="#ecfdf5"/>
        <text x="30" y="37" text-anchor="middle" font-size="18">💰</text>
        <text x="60" y="28" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#1e293b">5 Month Plan</text>
        <text x="60" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Monthly Payouts</text>
        <text x="205" y="36" text-anchor="end" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#10b981">+10.00%</text>
      </g>

      <!-- Action Button -->
      <g transform="translate(16, 350)">
        <rect x="0" y="0" width="220" height="44" rx="22" fill="url(#mintGrad)"/>
        <text x="110" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#ffffff">Create your Bullzz</text>
      </g>
    </g>

    <!-- Bottom home indicator bar -->
    <rect x="100" y="476" width="80" height="4" rx="2" fill="#cbd5e1"/>
  </g>
</svg>
